name: Build project docs

# Reusable workflow: builds and smoke-tests the docs of the calling repo (configured by its
# docs.config.json) with this platform's main branch. It never receives credentials; callers
# deploy the exported image themselves.
#
#   jobs:
#     build:
#       uses: daisytuner/docs-platform/.github/workflows/build-project.yml@main
#       with:
#         export-image: ${{ github.event_name != 'pull_request' }}

on:
  workflow_call:
    inputs:
      export-image:
        description: "Upload the image as the artifact named by the `artifact` output"
        type: boolean
        default: false
    outputs:
      project:
        description: "Project id from docs.config.json"
        value: ${{ jobs.build.outputs.project }}
      visibility:
        description: "public or internal"
        value: ${{ jobs.build.outputs.visibility }}
      artifact:
        description: "Artifact holding docs-image.tar.gz (docker save of the image `docs:build`)"
        value: ${{ jobs.build.outputs.artifact }}

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.config.outputs.project }}
      visibility: ${{ steps.config.outputs.visibility }}
      artifact: ${{ inputs.export-image && 'docs-image' || '' }}
    env:
      DOCS_SOURCE: source
    steps:
      - uses: actions/checkout@v7
        with:
          repository: daisytuner/docs-platform
          ref: main
          path: platform
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # The calling repo at the triggering commit; first only its config, which decides the other paths.
      - uses: actions/checkout@v7
        with:
          path: config
          sparse-checkout: docs.config.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read docs.config.json
        id: config
        working-directory: platform
        run: |
          node --input-type=module -e "
            import {loadProject} from './scripts/project.mjs';
            const p = loadProject('../config');
            console.log('project=' + p.id);
            console.log('visibility=' + p.visibility);
          " >> "$GITHUB_OUTPUT"
          {
            echo 'paths<<EOF'
            node scripts/sparse-paths.mjs ../config
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          path: platform/source
          sparse-checkout: ${{ steps.config.outputs.paths }}
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: platform
          build-args: DOCS_NOINDEX=${{ vars.DOCS_NOINDEX || 'true' }}
          tags: docs:build
          load: true
          cache-from: type=gha,scope=docs-${{ steps.config.outputs.project }}
          cache-to: type=gha,mode=max,scope=docs-${{ steps.config.outputs.project }}

      - name: Smoke test
        working-directory: platform
        run: |
          docker run -d --name docs -p 8080:8080 docs:build
          node scripts/smoke-test.mjs http://localhost:8080 || { docker logs docs; exit 1; }
          docker rm -f docs >/dev/null

      # Served from the cache of the previous build; only runs the final COPY.
      - name: Export Doxygen warnings
        uses: docker/build-push-action@v5
        with:
          context: platform
          target: artifacts
          build-args: DOCS_NOINDEX=${{ vars.DOCS_NOINDEX || 'true' }}
          outputs: type=local,dest=ci-artifacts
          cache-from: type=gha,scope=docs-${{ steps.config.outputs.project }}

      - name: Summarize Doxygen warnings
        run: |
          for log in ci-artifacts/doxygen-warnings/*.log; do
            [ -e "$log" ] || continue
            echo "Doxygen warnings: $(grep -c 'warning:' "$log" || true)" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Save image
        if: inputs.export-image
        run: docker save docs:build | gzip -1 > docs-image.tar.gz

      - name: Upload image
        if: inputs.export-image
        uses: actions/upload-artifact@v4
        with:
          name: docs-image
          path: docs-image.tar.gz
          retention-days: 1
          compression-level: 0
