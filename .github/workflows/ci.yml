name: CI

# Builds the public docc docs with this branch of the platform. Private projects are only built in
# their own repos, so nothing here needs credentials.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docc:
    name: Build docc docs
    runs-on: ubuntu-latest
    env:
      DOCS_SOURCE: source
    steps:
      - uses: actions/checkout@v7
        with:
          path: platform
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Type-check
        working-directory: platform
        run: |
          npm ci --no-fund --no-audit
          npx tsc --noEmit

      - uses: actions/checkout@v7
        with:
          repository: daisytuner/docc
          path: config
          sparse-checkout: docs.config.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Sparse paths
        id: paths
        working-directory: platform
        run: |
          {
            echo 'list<<EOF'
            node scripts/sparse-paths.mjs ../config
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: daisytuner/docc
          path: platform/source
          sparse-checkout: ${{ steps.paths.outputs.list }}
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: platform
          tags: docs:ci
          load: true
          cache-from: type=gha,scope=docs-ci
          cache-to: type=gha,mode=max,scope=docs-ci

      - name: Smoke test
        working-directory: platform
        run: |
          docker run -d --name docs -p 8080:8080 docs:ci
          node scripts/smoke-test.mjs http://localhost:8080 || { docker logs docs; exit 1; }
