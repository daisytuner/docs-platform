server {
    listen 8080;
    server_name _;
    root /srv/site;

    # Relative redirects keep the external host/scheme behind Firebase Hosting or IAP.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # @BASE@ is the site's baseUrl ("/" or "/docc/"), substituted in the Dockerfile.
    # The public build has no root page; send direct visits of the service URL to it.
    location = / {
        try_files /index.html @base;
    }

    location @base {
        return 302 @BASE@;
    }

    location / {
        # trailingSlash=false emits intro.html for the route /intro.
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Docusaurus asset filenames are content-hashed; add_header here replaces the server-level ones.
    location @BASE@assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    error_page 404 @BASE@404.html;
}
